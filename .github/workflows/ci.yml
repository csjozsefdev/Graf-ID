name: CI

on:
  push:
    branches: [main, master, release/**]
  pull_request:
    branches: [main, master, release/**]

jobs:
  python:
    name: Python tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest grafid/tests -q

  frontend:
    name: Frontend tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm test
        run: npm test

      - name: npm build
        run: npm run build

      - name: npm audit
        run: npm audit --audit-level=high

  rust:
    name: Rust checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Tauri bundle.resources requires runtime/ to exist at compile time.
      # The directory is gitignored except .gitkeep; ensure it is present on clean checkout.
      - name: Ensure runtime resource directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path runtime | Out-Null
          if (-not (Test-Path runtime/.gitkeep)) { New-Item -ItemType File -Path runtime/.gitkeep | Out-Null }

      - name: cargo check
        run: cargo check --locked

      - name: cargo test
        run: cargo test --locked
